[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agx_bus/__init__.py"

[project.urls]
source = "https://github.com/chanhyuk-jung/agx-bus"

[project]
name = "agx-bus"
authors = [
    { name = "Chanhyuk Jung", email = "seagullcjung@gmail.com" },
]
description = "Agx Bus: Bus interface for AgileX Robotics arms"
dynamic = ["version"]
readme = "README.md"
license = "LGPL-3.0"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["robotics"]

dependencies = [
    "numpy",
    # pyAgxArm dependencies
    "python-can>=3.3.4",
    "typing-extensions>=3.7.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.ruff]
line-length = 88
exclude = ["src/agx_bus/pyAgxArm"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I"
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agx_bus"]

[tool.ty.src]
exclude = ["src/agx_bus/pyAgxArm"]
